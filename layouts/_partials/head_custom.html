<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Lora:ital,wght@0,400;0,500;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/haiku.css" | relURL }}">
<style>
  /* ── Haiku blog: minimal, airy, poem-first ── */

  /* Post body: serif, generous line-height */
  .blog-post,
  .blog-post p,
  .post-preview .post-entry {
    font-family: 'Lora', Georgia, serif;
    font-size: 1.15rem;
    line-height: 1.9;
  }

  /* Post paragraphs: left-aligned, normal spacing */
  .blog-post p {
    margin-bottom: 1rem;
    text-align: left;
  }

  /* The poem on the list page — center it */
  .post-preview .post-entry {
    text-align: center;
    font-style: italic;
    color: #444;
  }

  /* Post title on list page: small, understated */
  .post-preview .post-title {
    font-size: 0.85rem;
    font-weight: normal;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #999;
  }

  /* Hide word count / reading time everywhere */
  .post-meta .middot,
  .post-meta [itemprop="wordCount"],
  .post-meta .reading-time {
    display: none;
  }

  /* Single post: left-aligned, full readable width */
  .blog-post {
    max-width: 820px;
    margin: 0 auto;
    text-align: left;
  }

  /* Headings inside a post */
  .blog-post h2, .blog-post h3 {
    font-family: 'Lora', Georgia, serif;
    font-weight: 600;
    font-style: normal;
    font-size: 1.1rem;
    color: #333;
    text-align: left;
    margin-top: 2.5rem;
    margin-bottom: 0.5rem;
  }

  /* Horizontal rule as a soft divider */
  .blog-post hr {
    border: none;
    border-top: 1px solid #e0e0e0;
    width: 100%;
    margin: 2rem 0;
  }

  /* YouTube embed: full bleed, no side gaps */
  .blog-post .youtube-embed,
  .blog-post iframe[src*="youtube"] {
    width: 100% !important;
    max-width: 100% !important;
  }
  /* Beautiful Hugo wraps shortcodes in a div — make it full width too */
  .blog-post > div[style*="position:relative"],
  .blog-post > div[style*="position: relative"] {
    width: 100% !important;
    max-width: 100% !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    padding-bottom: 56.25% !important; /* 16:9 */
  }
  .blog-post > div[style*="position:relative"] iframe,
  .blog-post > div[style*="position: relative"] iframe {
    width: 100% !important;
    height: 100% !important;
  }
  @media (max-width: 575px) {
    /* On phones: break out of the post padding so video is edge-to-edge */
    .blog-post > div[style*="position:relative"],
    .blog-post > div[style*="position: relative"] {
      margin-left: -1rem !important;
      margin-right: -1rem !important;
      width: calc(100% + 2rem) !important;
    }
  }

  /* Tables: full width, clean */
  .blog-post table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
    margin: 1.5rem 0;
  }
  .blog-post table th {
    background: #2c3e50;
    color: #fff;
    padding: 0.5rem 0.6rem;
    text-align: center;
    font-weight: 600;
  }
  .blog-post table td {
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid #e8e4dc;
    text-align: center;
  }
  .blog-post table tr:nth-child(even) td {
    background: rgba(0,0,0,0.03);
  }

  /* Tags: small and quiet */
  .blog-post .blog-tags a,
  .post-preview .post-meta a {
    font-size: 0.8rem;
    color: #aaa;
  }

  /* Nav: site title small and lowercase */
  .navbar-custom .navbar-brand {
    font-family: 'Lora', Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
  }

  /* Hide the avatar/logo on all screen sizes */
  .navbar-custom .avatar-container { display: none; }

  /* Page background: very light warm white */
  /* page background is set in static/css/haiku.css (linen) */

  @media (max-width: 575.98px) {
    .blog-post { max-width: 100%; padding: 0 1rem; }
    .blog-post, .blog-post p, .post-preview .post-entry { font-size: 1.05rem; }
  }
</style>
